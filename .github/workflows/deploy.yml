name: Test and Deploy Web

# Same model as the API: GitHub Actions tests, builds, uploads over SSH and starts the app.
#   - The app (a standalone Next.js server) lives in ~/crm-web, OUTSIDE public_html, so its code and
#     .env can never be downloaded.
#   - The subdomain crm-web.mkdir-solutions.com (public_html/crm-web) only gets an .htaccess that tells
#     the server's LiteSpeed to run the app with Node (the same "Passenger" settings a Node.js app
#     setup writes), and LiteSpeed starts and stops the Node process itself.
# GitHub secrets: SSH_KEY, SSH_HOST, SSH_USER, SSH_PORT (the hosting account, as for the API).
# GitHub variable (optional): API_BASE_URL (default https://crm-api.mkdir-solutions.com/api/v1).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Checks of a pull request: a newer commit cancels the older run.
# Deploys: never two at once, and a newer push waits for the running one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('tests-{0}', github.ref) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://crm-api.mkdir-solutions.com/api/v1' }}
  SITE_URL: https://crm-web.mkdir-solutions.com

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v4

      - name: 3. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 4. Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 5. Lint, Type-check and Test
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: 6. Build the release and start it like the server does (smoke test)
        env:
          NEXT_OUTPUT: standalone
        run: |
          pnpm --filter @crm/app build
          bash .github/scripts/assemble-release.sh
          bash .github/scripts/smoke-test.sh

  build-and-deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 3. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 4. Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 5. Build (standalone server)
        env:
          NEXT_OUTPUT: standalone
        run: pnpm --filter @crm/app build

      - name: 6. Assemble the release folder (the same script the smoke test used)
        run: bash .github/scripts/assemble-release.sh

      # Plain rsync + ssh (the ssh-deploy action crashed with "spawn E2BIG" on this release's size).
      - name: 7. Set up the SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 8. Upload the release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        # The app goes outside public_html. Excluded paths are never uploaded AND never deleted:
        # the server's .env and LiteSpeed's restart folder survive every deploy.
        run: |
          rsync -rlz --checksum --delete --stats \
            --exclude=/.env --exclude=/apps/app/tmp/ \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            apps/app/.next/standalone/ "$SSH_USER@$SSH_HOST:/home/$SSH_USER/crm-web/"

      - name: 9. Configure, restart and health-check on the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        # Settings go in on stdin ahead of the script, so they never appear in a process command line.
        run: |
          {
            printf 'export APP_DIR=%q\n' "/home/$SSH_USER/crm-web"
            printf 'export DOCROOT=%q\n' "/home/$SSH_USER/domains/mkdir-solutions.com/public_html/crm-web"
            printf 'export API_BASE_URL=%q\n' "$API_BASE_URL"
            printf 'export SITE_URL=%q\n' "$SITE_URL"
            cat .github/scripts/server-after-deploy.sh
          } | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s'
