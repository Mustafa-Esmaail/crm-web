name: Test and Deploy Web

# Same model as the API: GitHub Actions tests, builds, uploads over SSH and starts the app.
#   - The app (a standalone Next.js server) lives in ~/crm-web, OUTSIDE public_html, so its code and
#     .env can never be downloaded.
#   - The subdomain crm-web.mkdir-solutions.com (public_html/crm-web) only gets an .htaccess that tells
#     the server's LiteSpeed to run the app with Node (the same "Passenger" settings a Node.js app
#     setup writes), and LiteSpeed starts and stops the Node process itself.
# GitHub secrets: SSH_KEY, SSH_HOST, SSH_USER, SSH_PORT (the hosting account, as for the API).
# GitHub variable (optional): API_BASE_URL (default https://crm-api.mkdir-solutions.com/api/v1).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Checks of a pull request: a newer commit cancels the older run.
# Deploys: never two at once, and a newer push waits for the running one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('tests-{0}', github.ref) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://crm-api.mkdir-solutions.com/api/v1' }}
  SITE_URL: https://crm-web.mkdir-solutions.com

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v4

      - name: 3. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 4. Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 5. Lint, Type-check and Test
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

  build-and-deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 3. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 4. Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 5. Build (standalone server)
        env:
          NEXT_OUTPUT: standalone
        run: pnpm --filter @crm/app build

      - name: 6. Assemble the release folder
        # server.js does not include static assets; Next serves them once they sit next to it.
        # start.cjs loads the server's .env (it is never uploaded) and then starts server.js.
        run: |
          set -e
          APP=apps/app
          OUT=$APP/.next/standalone
          mkdir -p $OUT/$APP/.next
          cp -r $APP/.next/static $OUT/$APP/.next/static
          if [ -d $APP/public ]; then cp -r $APP/public $OUT/$APP/public; fi
          cat > $OUT/$APP/start.cjs <<'EOF'
          // Loads ~/crm-web/.env (server-only, never uploaded), then starts Next's standalone server.
          const path = require('node:path');
          process.loadEnvFile(path.join(__dirname, '..', '..', '.env'));
          require('./server.js');
          EOF
          test -f $OUT/$APP/server.js

      - name: 7. Deploy over SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "apps/app/.next/standalone/"
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          # The app goes outside public_html. Excluded paths are never uploaded AND never deleted:
          # the server's .env and LiteSpeed's restart folder survive every deploy.
          TARGET: "/home/${{ secrets.SSH_USER }}/crm-web"
          EXCLUDE: "/.env,/apps/app/tmp/"
          # Without this the action ignores a failing script and still reports success.
          SCRIPT_AFTER_REQUIRED: true
          SCRIPT_AFTER: |
            set -e
            APP_DIR="/home/${{ secrets.SSH_USER }}/crm-web"
            DOCROOT="/home/${{ secrets.SSH_USER }}/domains/mkdir-solutions.com/public_html/crm-web"
            cd "$APP_DIR"

            echo "== node"
            NODE_BIN="$(command -v node || true)"
            for candidate in /opt/alt/alt-nodejs22/root/usr/bin/node /opt/alt/alt-nodejs24/root/usr/bin/node /opt/alt/alt-nodejs20/root/usr/bin/node; do
              if [ -z "$NODE_BIN" ] && [ -x "$candidate" ]; then NODE_BIN="$candidate"; fi
            done
            test -n "$NODE_BIN" || { echo "ERROR: no node binary found on the server."; exit 1; }
            "$NODE_BIN" -e 'const m=+process.versions.node.split(".")[0]; if (m < 20) { console.error("ERROR: Node " + process.version + " is too old; Next.js needs 20.9+"); process.exit(1) } console.log("node", process.version)'
            echo "using $NODE_BIN"

            echo "== .env"
            # Created once with the values below; after that it is the server's file and never touched.
            if [ ! -f .env ]; then
              printf 'NODE_ENV=production\nAPI_BASE_URL=%s\n' "${{ env.API_BASE_URL }}" > .env
              echo "Created $APP_DIR/.env"
            fi
            chmod 600 .env

            echo "== subdomain .htaccess"
            mkdir -p "$DOCROOT"
            # A default page in the folder would be served instead of the app, so it is moved aside.
            for f in index.html index.php default.php; do
              if [ -f "$DOCROOT/$f" ]; then
                mkdir -p "$APP_DIR/../crm-web-docroot-backup"
                mv "$DOCROOT/$f" "$APP_DIR/../crm-web-docroot-backup/$f.$(date +%Y%m%d%H%M%S)"
                echo "Moved $f out of the subdomain folder."
              fi
            done
            cat > "$DOCROOT/.htaccess" <<HTACCESS
            # Written by the crm-web deploy workflow: LiteSpeed runs the Next.js app with Node.
            PassengerAppRoot "$APP_DIR/apps/app"
            PassengerBaseURI "/"
            PassengerNodejs "$NODE_BIN"
            PassengerAppType node
            PassengerStartupFile start.cjs
            HTACCESS

            echo "== restart"
            mkdir -p apps/app/tmp
            touch apps/app/tmp/restart.txt

            echo "== health check"
            # The first request starts the app, so give it time.
            for i in $(seq 1 12); do
              code=$(curl -s -o /dev/null -m 20 -w "%{http_code}" "${{ env.SITE_URL }}/en/login" || true)
              echo "try $i: HTTP $code"
              if [ "$code" = "200" ]; then echo "== deploy finished"; exit 0; fi
              sleep 5
            done
            echo "ERROR: ${{ env.SITE_URL }}/en/login did not answer 200."
            exit 1
