<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" role="img" aria-label="Smart CRM">
  <!-- Smart CRM logo: the app mark plus the wordmark. Colors mirror the gradient-logo token in tokens.css. -->
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6" />
      <stop offset="1" stop-color="#0f766e" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="96" height="96" rx="24" fill="url(#mark)" />
  <path
    d="M48 21l6.6 17.4L72 45l-17.4 6.6L48 69l-6.6-17.4L24 45l17.4-6.6z"
    fill="none"
    stroke="#fff"
    stroke-width="5.4"
    stroke-linejoin="round"
  />
  <text
    x="120"
    y="64"
    font-family="Inter, 'Segoe UI', Arial, sans-serif"
    font-size="44"
    font-weight="700"
    fill="#0f766e"
  >Smart <tspan fill="#14b8a6">CRM</tspan></text>
</svg>
