name: CI

# Deploys are done by Hostinger's Node.js Web App hosting, which is connected to this repository
# and rebuilds the site on every push to main. This workflow only checks the code: on pull requests
# (so problems show before merging) and on main.
# Hostinger does not wait for this workflow, so merge only when it is green.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A newer commit cancels the older run of the same branch or pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v4

      - name: 3. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 4. Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 5. Lint, Type-check and Test
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: 6. Build the standalone server (the same kind of build Hostinger makes)
        env:
          NEXT_OUTPUT: standalone
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://crm-api.mkdir-solutions.com/api/v1' }}
        run: |
          pnpm --filter @crm/app build
          test -f apps/app/.next/standalone/apps/app/server.js

# ---------------------------------------------------------------------------------------------------
# Hostinger setup (once, in hPanel):
#   Websites → Add website → Node.js apps → Import Git repository → this repo, branch main.
#   Framework: Next.js · Root directory: ./ · Build command: pnpm --filter @crm/app build
#   Output directory: apps/app/.next · Node.js version: 22
#   Environment variable: API_BASE_URL=https://crm-api.mkdir-solutions.com/api/v1
#   Domain: crm.mkdir-solutions.com, added as its own website (not a subfolder); SSL is automatic.
# ---------------------------------------------------------------------------------------------------
